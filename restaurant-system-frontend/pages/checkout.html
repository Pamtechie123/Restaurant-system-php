<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - ChopOps</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: "#F4511E"
                    }
                }
            }
        }
    </script>
</head>


<body class="min-h-screen bg-gray-50">


    <!-- NAVBAR -->
    <nav class="border-b bg-white">

        <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">

            <a
                href="../index.html"
                class="text-2xl font-bold text-brand"
            >
                ChopOps
            </a>


            <div class="flex gap-5 text-sm">

                <a
                    href="../index.html"
                    class="text-gray-700 hover:text-brand"
                >
                    Home
                </a>

                <a
                    href="menu.html"
                    class="text-gray-700 hover:text-brand"
                >
                    Menu
                </a>

                <a
                    href="cart.html"
                    class="text-gray-700 hover:text-brand"
                >
                    Cart
                </a>

            </div>

        </div>

    </nav>



    <!-- CHECKOUT -->
    <main class="mx-auto max-w-5xl px-4 py-10">

        <h1 class="mb-8 text-3xl font-bold">
            Checkout
        </h1>


        <div class="grid gap-8 md:grid-cols-2">


            <!-- CUSTOMER INFORMATION -->

            <section class="rounded-2xl bg-white p-6 shadow-sm">

                <h2 class="mb-6 text-xl font-bold">
                    Customer Information
                </h2>


                <form
                    id="checkout-form"
                    class="space-y-5"
                >


                    <!-- FULL NAME -->

                    <div>

                        <label
                            for="customerName"
                            class="mb-2 block text-sm font-medium"
                        >
                            Full Name
                        </label>


                        <input
                            id="customerName"
                            type="text"
                            required
                            class="w-full rounded-lg border px-4 py-3 outline-none focus:border-brand"
                            placeholder="Enter your name"
                        >

                    </div>



                    <!-- CUSTOMER PHONE -->

                    <div>

                        <label
                            for="customerPhone"
                            class="mb-2 block text-sm font-medium"
                        >
                            Phone Number
                        </label>


                        <input
                            id="customerPhone"
                            type="tel"
                            required
                            class="w-full rounded-lg border px-4 py-3 outline-none focus:border-brand"
                            placeholder="08012345678"
                        >

                    </div>



                    <!-- ORDER TYPE -->

                    <div>

                        <label
                            for="orderType"
                            class="mb-2 block text-sm font-medium"
                        >
                            Order Type
                        </label>


                        <select
                            id="orderType"
                            class="w-full rounded-lg border px-4 py-3 outline-none focus:border-brand"
                        >

                            <option value="takeaway">
                                Takeaway
                            </option>

                            <option value="dine-in">
                                Dine-in
                            </option>

                            <option value="delivery">
                                Delivery
                            </option>

                        </select>

                    </div>



                    <!-- DINE-IN INFORMATION -->

                    <div
                        id="dine-in-container"
                        class="hidden space-y-5 rounded-lg bg-gray-50 p-4"
                    >

                        <h3 class="font-semibold">
                            Dine-in Information
                        </h3>


                        <!-- RESERVATION ID -->

                        <div>

                            <label
                                for="reservationId"
                                class="mb-2 block text-sm font-medium"
                            >
                                Reservation ID
                            </label>


                            <input
                                id="reservationId"
                                type="text"
                                class="w-full rounded-lg border bg-white px-4 py-3 outline-none focus:border-brand"
                                placeholder="Enter reservation ID"
                            >

                        </div>


                        <!-- TABLE NUMBER -->

                        <div>

                            <label
                                for="tableNumber"
                                class="mb-2 block text-sm font-medium"
                            >
                                Table Number
                            </label>


                            <input
                                id="tableNumber"
                                type="number"
                                min="1"
                                class="w-full rounded-lg border bg-white px-4 py-3 outline-none focus:border-brand"
                                placeholder="Enter table number"
                            >

                        </div>

                    </div>



                    <!-- DELIVERY INFORMATION -->

                    <div
                        id="delivery-container"
                        class="hidden space-y-5 rounded-lg bg-gray-50 p-4"
                    >

                        <h3 class="font-semibold">
                            Delivery Information
                        </h3>


                        <!-- SHIPPING ADDRESS -->

                        <div>

                            <label
                                for="shippingAddress"
                                class="mb-2 block text-sm font-medium"
                            >
                                Shipping Address
                            </label>


                            <textarea
                                id="shippingAddress"
                                rows="3"
                                class="w-full rounded-lg border bg-white px-4 py-3 outline-none focus:border-brand"
                                placeholder="Enter your full delivery address"
                            ></textarea>

                        </div>



                        <!-- STATE -->

                        <div>

                            <label
                                for="state"
                                class="mb-2 block text-sm font-medium"
                            >
                                State
                            </label>


                            <input
                                id="state"
                                type="text"
                                class="w-full rounded-lg border bg-white px-4 py-3 outline-none focus:border-brand"
                                placeholder="Enter state"
                            >

                        </div>



                        <!-- CITY -->

                        <div>

                            <label
                                for="city"
                                class="mb-2 block text-sm font-medium"
                            >
                                City
                            </label>


                            <input
                                id="city"
                                type="text"
                                class="w-full rounded-lg border bg-white px-4 py-3 outline-none focus:border-brand"
                                placeholder="Enter city"
                            >

                        </div>



                        <!-- DELIVERY PHONE -->

                        <div>

                            <label
                                for="phone"
                                class="mb-2 block text-sm font-medium"
                            >
                                Delivery Phone Number
                            </label>


                            <input
                                id="phone"
                                type="tel"
                                class="w-full rounded-lg border bg-white px-4 py-3 outline-none focus:border-brand"
                                placeholder="08012345678"
                            >

                        </div>

                    </div>



                    <!-- PLACE ORDER -->

                    <button
                        type="submit"
                        class="w-full rounded-lg bg-brand px-6 py-4 font-bold text-white transition hover:opacity-90"
                    >
                        Place Order
                    </button>


                    <!-- CHECKOUT MESSAGE -->

                    <p
                        id="checkout-message"
                        class="text-center text-sm"
                    ></p>

                </form>

            </section>



            <!-- ORDER SUMMARY -->

            <section class="rounded-2xl bg-white p-6 shadow-sm">

                <h2 class="mb-6 text-xl font-bold">
                    Order Summary
                </h2>


                <div
                    id="checkout-items"
                    class="space-y-4"
                >
                    <!-- Cart items appear here -->
                </div>


                <div class="mt-6 border-t pt-5">

                    <div class="flex justify-between text-lg font-bold">

                        <span>
                            Total
                        </span>


                        <span
                            id="checkout-total"
                            class="text-brand"
                        >
                            ₦0
                        </span>

                    </div>

                </div>

            </section>

        </div>

    </main>



    <script src="../js/checkout.js"></script>

</body>

</html>
