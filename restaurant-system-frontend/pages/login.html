<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ChopOps</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: "#F4511E"
                    }
                }
            }
        }
    </script>

</head>


<body class="flex min-h-screen items-center justify-center bg-gray-100 px-6">


    <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">

        <a href="../index.html"
           class="text-2xl font-extrabold text-brand">
            ChopOps
        </a>

        <h1 class="mt-8 text-3xl font-bold">
            Welcome back
        </h1>

        <p class="mt-2 text-gray-500">
            Login to your account.
        </p>


        <form id="login-form" class="mt-8 space-y-5">

            <div>

                <label class="mb-2 block font-medium">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    required
                    class="w-full rounded-lg border px-4 py-3 outline-none focus:border-brand"
                    placeholder="you@example.com"
                >

            </div>


            <div>

                <label class="mb-2 block font-medium">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    required
                    class="w-full rounded-lg border px-4 py-3 outline-none focus:border-brand"
                    placeholder="Your password"
                >

            </div>


            <button
                type="submit"
                class="w-full rounded-lg bg-brand px-5 py-3 font-semibold text-white"
            >
                Login
            </button>

        </form>

        <p class="mt-6 text-center text-sm text-gray-500">
    Don't have an account?
    <a href="register.html"
       class="font-semibold text-brand">
        Sign up
    </a>
</p>


        <p id="login-message"
           class="mt-5 text-center text-sm">
        </p>

    </div>


    <script src="../js/auth.js"></script>

</body>

</html>
