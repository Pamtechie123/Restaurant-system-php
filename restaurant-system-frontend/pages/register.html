<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | ChopOps</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: "#F4511E"
                    }
                }
            }
        }
    </script>
</head>

<body class="flex min-h-screen items-center justify-center bg-gray-100 px-6">

    <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">

        <a href="../index.html"
           class="text-2xl font-extrabold text-brand">
            ChopOps
        </a>

        <h1 class="mt-8 text-3xl font-bold">
            Create an account
        </h1>

        <p class="mt-2 text-gray-500">
            Sign up to order food and make reservations.
        </p>

        <form id="register-form" class="mt-8 space-y-5">

            <div>
                <label class="mb-2 block font-medium">
                    Name
                </label>

                <input
                    id="name"
                    type="text"
                    required
                    class="w-full rounded-lg border px-4 py-3"
                    placeholder="Your name"
                >
            </div>

            <div>
                <label class="mb-2 block font-medium">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    required
                    class="w-full rounded-lg border px-4 py-3"
                    placeholder="you@example.com"
                >
            </div>

            <div>
                <label class="mb-2 block font-medium">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    required
                    minlength="6"
                    class="w-full rounded-lg border px-4 py-3"
                    placeholder="Create a password"
                >
            </div>

            <button
                type="submit"
                class="w-full rounded-lg bg-brand px-5 py-3 font-semibold text-white">
                Create Account
            </button>

        </form>

        <p id="register-message"
           class="mt-5 text-center text-sm">
        </p>

        <p class="mt-6 text-center text-sm text-gray-500">
            Already have an account?
            <a href="login.html"
               class="font-semibold text-brand">
                Login
            </a>
        </p>

    </div>

    <script src="../js/register.js"></script>

</body>
</html>
