<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ChopOps</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/config.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="relative min-h-screen overflow-x-hidden bg-cream">
    <img src="images/chicken.webp" alt="" class="pointer-events-none absolute -right-6 -top-4 w-40 sm:w-64">
    <img src="images/kebab.webp" alt="" class="pointer-events-none absolute -bottom-6 -left-6 w-40 sm:w-64">

    <main class="relative mx-auto flex min-h-screen max-w-md flex-col justify-center px-4 py-10">
        <a href="index.html"><img src="images/logo.png" alt="ChopOps" class="mx-auto h-24"></a>
        <p class="mt-1 text-center text-xs tracking-widest">GOOD FOOD.....<span class="text-brand">GREAT MOOD</span></p>

        <h1 class="mt-6 text-center text-3xl font-extrabold">Welcome Back!</h1>
        <p class="text-center text-ink/70">Log in to your account to continue</p>

        <form id="login-form" class="mt-6 space-y-4 rounded-3xl bg-white/90 p-6 shadow-lg">
            <div>
                <label for="email" class="label">Email Address</label>
                <input id="email" type="email" class="input" placeholder="Enter your email" required>
            </div>
            <div>
                <label for="password" class="label">Password</label>
                <div class="relative">
                    <input id="password" type="password" class="input pr-16" placeholder="Enter your password" required>
                    <button type="button" data-toggle="password" class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-brand">SHOW</button>
                </div>
            </div>

            <p id="message" class="hidden text-center text-sm text-red-600"></p>
            <button class="btn w-full">Login</button>

            <p class="text-center text-sm">Don't have an account? <a href="register.html" class="font-bold text-brand">Create account</a></p>
        </form>
    </main>

    <script src="js/app.js"></script>
    <script>
        const form = document.getElementById("login-form");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            message.classList.add("hidden");

            try {
                const data = await api("/auth/login", {
                    method: "POST",
                    body: {
                        email: document.getElementById("email").value,
                        password: document.getElementById("password").value,
                    },
                });
                saveSession(data);

                // Go back to the page the person came from (only plain page names are allowed)
                const next = new URLSearchParams(location.search).get("next");
                location.href = next && /^[\w-]+\.html(\?.*)?$/.test(next) ? next : "index.html";
            } catch (error) {
                message.textContent = error.message;
                message.classList.remove("hidden");
            }
        });
    </script>
</body>
</html>
