<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations | ChopOps Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 md:flex">
    <aside id="sidebar" class="bg-ink text-white md:min-h-screen md:w-64 md:shrink-0"></aside>

    <main class="flex-1 p-4 md:p-8">
        <h1 class="text-3xl font-extrabold">Reservations</h1>
        <p class="text-ink/60">Confirm a request by giving the guests a table number.</p>

        <div id="filters" class="mt-5 flex gap-2 overflow-x-auto pb-2"></div>
        <div id="list" class="mt-4 space-y-4"><p class="text-ink/60">Loading...</p></div>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        const STATUSES = ["requested", "confirmed", "seated", "completed", "cancelled"];
        const filterBox = document.getElementById("filters");
        const box = document.getElementById("list");

        let reservations = [];
        let filter = "requested";

        // The buttons shown depend on the current status
        function actions(r) {
            if (r.status === "requested") {
                return `
                    <input type="number" min="1" placeholder="Table no." data-table="${r.id}" class="input w-28 py-2">
                    <button class="btn btn-sm" data-id="${r.id}" data-action="confirmed">Confirm</button>
                    <button class="btn btn-sm btn-danger" data-id="${r.id}" data-action="cancelled">Decline</button>`;
            }
            if (r.status === "confirmed") {
                return `
                    <button class="btn btn-sm" data-id="${r.id}" data-action="seated">Mark as seated</button>
                    <button class="btn btn-sm btn-danger" data-id="${r.id}" data-action="cancelled">Cancel</button>`;
            }
            if (r.status === "seated") {
                return `<button class="btn btn-sm" data-id="${r.id}" data-action="completed">Complete</button>`;
            }
            return "";
        }

        function show() {
            filterBox.innerHTML = ["all", ...STATUSES]
                .map((status) => {
                    const count = status === "all" ? reservations.length : reservations.filter((r) => r.status === status).length;
                    return `<button class="pill capitalize ${status === filter ? "active" : ""}" data-filter="${status}">${status} (${count})</button>`;
                })
                .join("");

            const filtered = filter === "all" ? reservations : reservations.filter((r) => r.status === filter);

            box.innerHTML = filtered.length
                ? filtered.map((r) => `
                <article class="card flex flex-wrap items-center justify-between gap-4 p-5">
                    <div>
                        <h2 class="font-bold">${esc(r.customerName)} ${badge(r.status)}</h2>
                        <p class="text-sm">${formatDay(r.date)} at ${esc(r.time)} · ${r.partySize} guest(s)${r.tableNumber ? " · Table " + r.tableNumber : ""}</p>
                        <p class="text-sm text-ink/60">${esc(r.phone)}</p>
                    </div>
                    <div class="flex flex-wrap items-center gap-2">${actions(r)}</div>
                </article>`).join("")
                : '<p class="text-ink/60">No reservations here.</p>';
        }

        async function load() {
            try {
                reservations = await api("/admin/reservations");
                show();
            } catch (error) {
                box.innerHTML = `<p class="text-red-600">${esc(error.message)}</p>`;
            }
        }

        filterBox.addEventListener("click", (event) => {
            const button = event.target.closest("[data-filter]");
            if (!button) return;
            filter = button.dataset.filter;
            show();
        });

        box.addEventListener("click", async (event) => {
            const button = event.target.closest("[data-action]");
            if (!button) return;

            const body = { status: button.dataset.action };

            if (body.status === "confirmed") {
                body.tableNumber = Number(document.querySelector(`[data-table="${button.dataset.id}"]`).value);
            }

            try {
                await api("/admin/reservations/" + button.dataset.id, { method: "PATCH", body });
                toast("Reservation updated");
                load();
            } catch (error) {
                toast(error.message, true);
            }
        });

        if (requireAdmin()) load();
    </script>
</body>
</html>
