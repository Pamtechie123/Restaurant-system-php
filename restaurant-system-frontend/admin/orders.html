<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | ChopOps Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 md:flex">
    <aside id="sidebar" class="bg-ink text-white md:min-h-screen md:w-64 md:shrink-0"></aside>

    <main class="flex-1 p-4 md:p-8">
        <h1 class="text-3xl font-extrabold">Orders</h1>
        <p class="text-ink/60">Change the status of an order and the customer will see it on their orders page.</p>

        <div id="filters" class="mt-5 flex gap-2 overflow-x-auto pb-2"></div>
        <div id="orders" class="mt-4 space-y-4"><p class="text-ink/60">Loading...</p></div>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        const STATUSES = ["pending", "preparing", "ready", "served", "cancelled"];
        const filterBox = document.getElementById("filters");
        const box = document.getElementById("orders");

        let orders = [];
        let filter = "all";

        function where(order) {
            if (order.orderType === "delivery") return `${esc(order.shippingAddress)}, ${esc(order.city)}, ${esc(order.state)} · ${esc(order.phone)}`;
            if (order.orderType === "dine-in") return `Table ${order.tableNumber}`;
            return "Pick up at the restaurant";
        }

        function show() {
            // Filter buttons with a count for each status
            filterBox.innerHTML = ["all", ...STATUSES]
                .map((status) => {
                    const count = status === "all" ? orders.length : orders.filter((o) => o.status === status).length;
                    return `<button class="pill capitalize ${status === filter ? "active" : ""}" data-filter="${status}">${status} (${count})</button>`;
                })
                .join("");

            const list = filter === "all" ? orders : orders.filter((order) => order.status === filter);

            box.innerHTML = list.length
                ? list.map((order) => `
                <article class="card p-5">
                    <div class="flex flex-wrap items-start justify-between gap-3">
                        <div>
                            <h2 class="font-bold">#${order.id.slice(-6).toUpperCase()} · ${esc(order.customerName)}</h2>
                            <p class="text-sm text-ink/60">${formatDate(order.createdAt)} · <span class="capitalize">${esc(order.orderType)}</span></p>
                        </div>
                        <select data-status="${order.id}" class="input w-auto py-2 capitalize">
                            ${STATUSES.map((s) => `<option value="${s}" ${s === order.status ? "selected" : ""}>${s}</option>`).join("")}
                        </select>
                    </div>
                    <p class="mt-2 text-sm text-ink/70">${where(order)}</p>
                    <ul class="mt-3 text-sm">
                        ${order.items.map((item) => `<li>${item.quantity} × ${esc(item.name)}</li>`).join("")}
                    </ul>
                    <p class="mt-3 font-extrabold">${money(order.total)}</p>
                </article>`).join("")
                : '<p class="text-ink/60">No orders here.</p>';
        }

        async function load() {
            try {
                orders = await api("/admin/orders");
                show();
            } catch (error) {
                box.innerHTML = `<p class="text-red-600">${esc(error.message)}</p>`;
            }
        }

        filterBox.addEventListener("click", (event) => {
            const button = event.target.closest("[data-filter]");
            if (!button) return;
            filter = button.dataset.filter;
            show();
        });

        box.addEventListener("change", async (event) => {
            const select = event.target.closest("[data-status]");
            if (!select) return;

            try {
                await api(`/admin/orders/${select.dataset.status}/status`, { method: "PATCH", body: { status: select.value } });
                orders.find((o) => o.id === select.dataset.status).status = select.value;
                toast("Order updated");
                show();
            } catch (error) {
                toast(error.message, true);
                load();
            }
        });

        if (requireAdmin()) {
            load();
            // Pick up new orders every 30 seconds (unless the admin is choosing a status)
            setInterval(() => {
                if (document.activeElement.tagName !== "SELECT") load();
            }, 30000);
        }
    </script>
</body>
</html>
