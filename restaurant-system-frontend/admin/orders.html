<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orders | ChopOps Admin</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: "#fff7ed",
                            100: "#ffedd5",
                            500: "#f97316",
                            600: "#ea580c",
                            700: "#c2410c"
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-100 text-gray-800">

<div class="min-h-screen flex">

    <!-- SIDEBAR -->
    <aside
        id="sidebar"
        class="fixed lg:static inset-y-0 left-0 z-50 w-64 bg-white border-r border-gray-200 transform -translate-x-full lg:translate-x-0 transition-transform duration-300"
    >

        <div class="h-full flex flex-col">

            <div class="px-6 py-6 border-b">
                <div class="flex items-center gap-3">

                    <div class="w-10 h-10 rounded-xl bg-orange-500 flex items-center justify-center text-white font-bold text-xl">
                        C
                    </div>

                    <div>
                        <h1 class="font-bold text-xl text-gray-900">
                            ChopOps
                        </h1>

                        <p class="text-xs text-gray-500">
                            Admin Panel
                        </p>
                    </div>

                </div>
            </div>


            <!-- NAVIGATION -->
            <nav class="flex-1 px-4 py-6 space-y-2">

                <a
                    href="dashboard.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-orange-50 hover:text-orange-600"
                >
                    <span>📊</span>
                    <span>Dashboard</span>
                </a>

                <a
                    href="customers.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-orange-50 hover:text-orange-600"
                >
                    <span>👥</span>
                    <span>Customers</span>
                </a>

                <a
                    href="orders.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg bg-orange-50 text-orange-600 font-semibold"
                >
                    <span>🛒</span>
                    <span>Orders</span>
                </a>

                <a
                    href="reservations.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-orange-50 hover:text-orange-600"
                >
                    <span>📅</span>
                    <span>Reservations</span>
                </a>

                <a
                    href="menu.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-orange-50 hover:text-orange-600"
                >
                    <span>🍔</span>
                    <span>Menu</span>
                </a>

            </nav>


            <!-- LOGOUT -->
            <div class="p-4 border-t">

                <button
                    id="logout-btn"
                    class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-red-600 hover:bg-red-50"
                >
                    <span>🚪</span>
                    <span>Logout</span>
                </button>

            </div>

        </div>

    </aside>


    <!-- MAIN -->
    <div class="flex-1 min-w-0">

        <!-- HEADER -->
        <header class="bg-white border-b border-gray-200">

            <div class="px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">

                <div class="flex items-center gap-4">

                    <button
                        id="menu-toggle"
                        class="lg:hidden p-2 rounded-lg hover:bg-gray-100"
                    >
                        ☰
                    </button>

                    <div>

                        <h2 class="text-2xl font-bold text-gray-900">
                            Orders
                        </h2>

                        <p class="text-sm text-gray-500">
                            Manage customer orders and update their status.
                        </p>

                    </div>

                </div>


                <div class="hidden sm:block">

                    <span
                        id="admin-name"
                        class="text-sm font-medium text-gray-700"
                    >
                        Admin
                    </span>

                </div>

            </div>

        </header>


        <!-- CONTENT -->
        <main class="p-4 sm:p-6 lg:p-8">


            <!-- SEARCH -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 mb-6">

                <input
                    type="text"
                    id="search-input"
                    placeholder="Search orders..."
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
                >

            </div>


            <!-- LOADING -->
            <div
                id="loading"
                class="bg-white rounded-xl border border-gray-200 p-10 text-center"
            >

                <div class="animate-spin w-8 h-8 border-4 border-orange-500 border-t-transparent rounded-full mx-auto mb-4"></div>

                <p class="text-gray-500">
                    Loading orders...
                </p>

            </div>


            <!-- ERROR -->
            <div
                id="error-message"
                class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 mb-6"
            ></div>


            <!-- ORDERS -->
            <div
                id="orders-wrapper"
                class="hidden bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden"
            >

                <div class="overflow-x-auto">

                    <table class="w-full">

                        <thead class="bg-gray-50 border-b">

                            <tr>

                                <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase">
                                    Order
                                </th>

                                <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase">
                                    Customer
                                </th>

                                <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase">
                                    Type
                                </th>

                                <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase">
                                    Total
                                </th>

                                <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase">
                                    Status
                                </th>

                                <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase">
                                    Update
                                </th>

                            </tr>

                        </thead>

                        <tbody
                            id="orders-table"
                            class="divide-y divide-gray-100"
                        ></tbody>

                    </table>

                </div>


                <!-- NO ORDERS -->
                <div
                    id="no-orders"
                    class="hidden text-center py-12"
                >

                    <div class="text-5xl mb-4">
                        🛒
                    </div>

                    <h3 class="font-semibold text-gray-900 text-lg">
                        No orders found
                    </h3>

                    <p class="text-gray-500 mt-1">
                        There are no orders matching your search.
                    </p>

                </div>

            </div>

        </main>

    </div>

</div>


<script>

const API_URL = "http://localhost:8000/api";

const token = localStorage.getItem("token");

const storedUser = localStorage.getItem("user");

let currentUser = null;

try {

    currentUser = storedUser
        ? JSON.parse(storedUser)
        : null;

} catch {

    currentUser = null;

}


/*
|--------------------------------------------------------------------------
| AUTH CHECK
|--------------------------------------------------------------------------
*/

if (!token) {

    window.location.href =
        "../pages/login.html";

}


if (
    currentUser &&
    currentUser.role &&
    currentUser.role !== "admin" &&
    currentUser.role !== "staff"
) {

    alert(
        "You do not have permission to access the admin panel."
    );

    window.location.href =
        "../index.html";

}


/*
|--------------------------------------------------------------------------
| ADMIN NAME
|--------------------------------------------------------------------------
*/

if (currentUser && currentUser.name) {

    document.getElementById(
        "admin-name"
    ).textContent = currentUser.name;

}


/*
|--------------------------------------------------------------------------
| ELEMENTS
|--------------------------------------------------------------------------
*/

const ordersTable =
    document.getElementById("orders-table");

const loading =
    document.getElementById("loading");

const ordersWrapper =
    document.getElementById("orders-wrapper");

const errorMessage =
    document.getElementById("error-message");

const noOrders =
    document.getElementById("no-orders");

const searchInput =
    document.getElementById("search-input");

let allOrders = [];


/*
|--------------------------------------------------------------------------
| GET ORDER ID
|--------------------------------------------------------------------------
*/

function getOrderId(order) {

    if (!order || !order._id) {
        return "";
    }

    if (typeof order._id === "string") {
        return order._id;
    }

    if (typeof order._id === "object") {

        if (order._id.$oid) {
            return String(order._id.$oid);
        }

        if (order._id.oid) {
            return String(order._id.oid);
        }

        if (order._id.id) {
            return String(order._id.id);
        }

    }

    return String(order._id);

}


/*
|--------------------------------------------------------------------------
| ESCAPE HTML
|--------------------------------------------------------------------------
*/

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/*
|--------------------------------------------------------------------------
| MONEY
|--------------------------------------------------------------------------
*/

function formatMoney(amount) {

    return "₦" +
        Number(amount || 0).toLocaleString(
            "en-NG",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

}


/*
|--------------------------------------------------------------------------
| STATUS BADGE
|--------------------------------------------------------------------------
*/

function getStatusBadge(status) {

    const value =
        String(status || "pending").toLowerCase();

    const classes = {

        pending:
            "bg-yellow-100 text-yellow-700",

        preparing:
            "bg-purple-100 text-purple-700",

        ready:
            "bg-blue-100 text-blue-700",

        served:
            "bg-green-100 text-green-700",

        cancelled:
            "bg-red-100 text-red-700"

    };

    return `
        <span class="inline-flex px-3 py-1 rounded-full text-xs font-semibold ${classes[value] || "bg-gray-100 text-gray-700"}">
            ${value.charAt(0).toUpperCase() + value.slice(1)}
        </span>
    `;

}


/*
|--------------------------------------------------------------------------
| CUSTOMER NAME
|--------------------------------------------------------------------------
*/

function getCustomerName(order) {

    return (
        order.customerName ||
        order.customer?.name ||
        order.userName ||
        order.user?.name ||
        order.customer?.email ||
        order.email ||
        "Customer"
    );

}


/*
|--------------------------------------------------------------------------
| ORDER TYPE
|--------------------------------------------------------------------------
*/

function getOrderType(order) {

    return (
        order.orderType ||
        order.type ||
        "N/A"
    );

}


/*
|--------------------------------------------------------------------------
| ORDER TOTAL
|--------------------------------------------------------------------------
*/

function getOrderTotal(order) {

    return (
        order.total ??
        order.totalAmount ??
        order.amount ??
        0
    );

}


/*
|--------------------------------------------------------------------------
| LOAD ORDERS
|--------------------------------------------------------------------------
*/

async function loadOrders() {

    loading.classList.remove("hidden");

    ordersWrapper.classList.add("hidden");

    errorMessage.classList.add("hidden");


    try {

        const response =
            await fetch(
                `${API_URL}/orders`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`,

                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const text =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(text);

        } catch {

            throw new Error(
                "The server returned an invalid response."
            );

        }


        console.log(
            "Orders response:",
            response.status,
            data
        );


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                `Server returned ${response.status}`
            );

        }


        if (Array.isArray(data)) {

            allOrders = data;

        } else if (Array.isArray(data.orders)) {

            allOrders = data.orders;

        } else if (Array.isArray(data.data)) {

            allOrders = data.data;

        } else {

            allOrders = [];

        }


        renderOrders(allOrders);


    } catch (error) {

        console.error(
            "LOAD ORDERS ERROR:",
            error
        );

        errorMessage.textContent =
            "Could not load orders: " +
            error.message;

        errorMessage.classList.remove("hidden");

    } finally {

        loading.classList.add("hidden");

        ordersWrapper.classList.remove("hidden");

    }

}


/*
|--------------------------------------------------------------------------
| RENDER ORDERS
|--------------------------------------------------------------------------
*/

function renderOrders(orders) {

    ordersTable.innerHTML = "";


    if (!orders || orders.length === 0) {

        noOrders.classList.remove("hidden");

        return;

    }


    noOrders.classList.add("hidden");


    orders.forEach(
        (order, index) => {

            const id =
                getOrderId(order);

            const customer =
                getCustomerName(order);

            const type =
                getOrderType(order);

            const total =
                getOrderTotal(order);

            const status =
                String(
                    order.status || "pending"
                ).toLowerCase();


            const shortId =
                id
                    ? id.substring(0, 8)
                    : `${index + 1}`;


            const row =
                document.createElement("tr");


            row.className =
                "hover:bg-gray-50";


            row.innerHTML = `

                <td class="px-6 py-4">

                    <div class="font-semibold text-gray-900">
                        #${escapeHtml(shortId)}
                    </div>

                    <div class="text-xs text-gray-400 mt-1">
                        ${escapeHtml(id)}
                    </div>

                </td>


                <td class="px-6 py-4">

                    <div class="font-medium text-gray-900">
                        ${escapeHtml(customer)}
                    </div>

                </td>


                <td class="px-6 py-4">

                    <span class="capitalize text-gray-700">
                        ${escapeHtml(String(type))}
                    </span>

                </td>


                <td class="px-6 py-4">

                    <span class="font-semibold text-gray-900">
                        ${formatMoney(total)}
                    </span>

                </td>


                <td class="px-6 py-4">

                    ${getStatusBadge(status)}

                </td>


                <td class="px-6 py-4">

                    <select
                        class="order-status-select border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                    >

                        <option
                            value="pending"
                            ${status === "pending" ? "selected" : ""}
                        >
                            Pending
                        </option>

                        <option
                            value="preparing"
                            ${status === "preparing" ? "selected" : ""}
                        >
                            Preparing
                        </option>

                        <option
                            value="ready"
                            ${status === "ready" ? "selected" : ""}
                        >
                            Ready
                        </option>

                        <option
                            value="served"
                            ${status === "served" ? "selected" : ""}
                        >
                            Served
                        </option>

                        <option
                            value="cancelled"
                            ${status === "cancelled" ? "selected" : ""}
                        >
                            Cancelled
                        </option>

                    </select>

                </td>

            `;


            const select =
                row.querySelector(
                    ".order-status-select"
                );


            select.addEventListener(
                "change",
                function () {

                    updateOrderStatus(
                        id,
                        this.value
                    );

                }
            );


            ordersTable.appendChild(row);

        }
    );

}


/*
|--------------------------------------------------------------------------
| UPDATE ORDER STATUS
|--------------------------------------------------------------------------
*/

async function updateOrderStatus(
    id,
    status
) {

    if (!id) {

        alert(
            "This order does not have a valid ID."
        );

        return;

    }


    if (!status) {
        return;
    }


    console.log(
        "Updating order:",
        id
    );

    console.log(
        "New status:",
        status
    );


    try {

        const response =
            await fetch(
                `${API_URL}/orders/${encodeURIComponent(id)}/status`,
                {
                    method: "PATCH",

                    headers: {

                        "Authorization":
                            `Bearer ${token}`,

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({
                        status: status
                    })

                }
            );


        const text =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(text);

        } catch {

            data = {
                message: text
            };

        }


        console.log(
            "Status response:",
            response.status,
            data
        );


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                `Server returned ${response.status}`
            );

        }


        alert(
            "Order status updated successfully."
        );


        await loadOrders();


    } catch (error) {

        console.error(
            "ORDER STATUS ERROR:",
            error
        );

        alert(
            "Could not update order:\n\n" +
            error.message
        );

    }

}


/*
|--------------------------------------------------------------------------
| SEARCH
|--------------------------------------------------------------------------
*/

searchInput.addEventListener(
    "input",
    function () {

        const query =
            this.value
                .trim()
                .toLowerCase();


        if (!query) {

            renderOrders(
                allOrders
            );

            return;

        }


        const filtered =
            allOrders.filter(
                order => {

                    const id =
                        getOrderId(order)
                            .toLowerCase();

                    const customer =
                        getCustomerName(order)
                            .toLowerCase();

                    const type =
                        String(
                            getOrderType(order)
                        )
                        .toLowerCase();

                    const status =
                        String(
                            order.status || ""
                        )
                        .toLowerCase();


                    return (
                        id.includes(query) ||
                        customer.includes(query) ||
                        type.includes(query) ||
                        status.includes(query)
                    );

                }
            );


        renderOrders(
            filtered
        );

    }
);


/*
|--------------------------------------------------------------------------
| LOGOUT
|--------------------------------------------------------------------------
*/

document
    .getElementById("logout-btn")
    .addEventListener(
        "click",
        function () {

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "user"
            );

            window.location.href =
                "../pages/login.html";

        }
    );


/*
|--------------------------------------------------------------------------
| MOBILE SIDEBAR
|--------------------------------------------------------------------------
*/

document
    .getElementById("menu-toggle")
    .addEventListener(
        "click",
        function () {

            document
                .getElementById("sidebar")
                .classList.toggle(
                    "-translate-x-full"
                );

        }
    );


/*
|--------------------------------------------------------------------------
| START
|--------------------------------------------------------------------------
*/

loadOrders();

</script>

</body>
</html>
