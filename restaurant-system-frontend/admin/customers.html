<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers | ChopOps Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 md:flex">
    <aside id="sidebar" class="bg-ink text-white md:min-h-screen md:w-64 md:shrink-0"></aside>

    <main class="flex-1 p-4 md:p-8">
        <h1 class="text-3xl font-extrabold">Customers</h1>
        <p class="text-ink/60">A deactivated customer cannot log in or place orders.</p>

        <input id="search" type="search" class="input mt-5 max-w-md" placeholder="Search by name or email...">

        <div class="card mt-4 overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="border-b bg-cream text-ink/70">
                    <tr>
                        <th class="p-3">Customer</th><th class="p-3">Joined</th><th class="p-3">Orders</th>
                        <th class="p-3">Spent</th><th class="p-3">Status</th><th class="p-3"></th>
                    </tr>
                </thead>
                <tbody id="customers"><tr><td colspan="6" class="p-4 text-ink/60">Loading...</td></tr></tbody>
            </table>
        </div>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        const table = document.getElementById("customers");
        const searchInput = document.getElementById("search");
        let customers = [];

        function show() {
            const text = searchInput.value.trim().toLowerCase();
            const list = customers.filter((c) => c.name.toLowerCase().includes(text) || c.email.includes(text));

            table.innerHTML = list.length
                ? list.map((c) => `
                <tr class="border-b last:border-0">
                    <td class="p-3">
                        <p class="font-bold">${esc(c.name)}</p>
                        <p class="text-xs text-ink/60">${esc(c.email)}</p>
                    </td>
                    <td class="p-3">${c.createdAt ? formatDay(c.createdAt) : "-"}</td>
                    <td class="p-3">${c.orders}</td>
                    <td class="p-3">${money(c.spent)}</td>
                    <td class="p-3">${badge(c.status)}</td>
                    <td class="p-3 text-right">
                        <button class="btn btn-sm ${c.status === "blocked" ? "" : "btn-danger"}"
                                data-id="${c.id}" data-set="${c.status === "blocked" ? "active" : "blocked"}">
                            ${c.status === "blocked" ? "Activate" : "Deactivate"}
                        </button>
                    </td>
                </tr>`).join("")
                : '<tr><td colspan="6" class="p-4 text-ink/60">No customers found.</td></tr>';
        }

        async function load() {
            try {
                customers = await api("/admin/customers");
                show();
            } catch (error) {
                table.innerHTML = `<tr><td colspan="6" class="p-4 text-red-600">${esc(error.message)}</td></tr>`;
            }
        }

        searchInput.addEventListener("input", show);

        table.addEventListener("click", async (event) => {
            const button = event.target.closest("[data-set]");
            if (!button) return;

            const customer = customers.find((c) => c.id === button.dataset.id);
            const action = button.dataset.set === "blocked" ? "deactivate" : "activate";
            if (!confirm(`Do you want to ${action} ${customer.name}?`)) return;

            try {
                await api(`/admin/customers/${button.dataset.id}/status`, { method: "PATCH", body: { status: button.dataset.set } });
                toast("Customer updated");
                load();
            } catch (error) {
                toast(error.message, true);
            }
        });

        if (requireAdmin()) load();
    </script>
</body>
</html>
