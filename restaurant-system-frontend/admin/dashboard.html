<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | ChopOps Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 md:flex">
    <aside id="sidebar" class="bg-ink text-white md:min-h-screen md:w-64 md:shrink-0"></aside>

    <main class="flex-1 p-4 md:p-8">
        <h1 class="text-3xl font-extrabold">Dashboard</h1>
        <p class="text-ink/60">A quick look at how the restaurant is doing.</p>

        <div id="stats" class="mt-6 grid grid-cols-2 gap-4 lg:grid-cols-3"></div>

        <h2 class="mt-10 text-xl font-bold">Recent orders</h2>
        <div class="card mt-3 overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="border-b bg-cream text-ink/70">
                    <tr><th class="p-3">Order</th><th class="p-3">Customer</th><th class="p-3">Type</th><th class="p-3">Total</th><th class="p-3">Status</th></tr>
                </thead>
                <tbody id="recent"></tbody>
            </table>
        </div>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        function card(label, value, link, note = "") {
            return `
            <a href="${link}" class="card p-5 transition hover:-translate-y-0.5">
                <p class="text-sm text-ink/60">${label}</p>
                <p class="mt-1 text-3xl font-extrabold">${value}</p>
                <p class="text-xs text-ink/50">${note}</p>
            </a>`;
        }

        if (requireAdmin()) {
            api("/admin/stats")
                .then((stats) => {
                    document.getElementById("stats").innerHTML =
                        card("Total orders", stats.orders, "orders.html") +
                        card("Pending orders", stats.pendingOrders, "orders.html", "waiting to be prepared") +
                        card("Revenue", money(stats.revenue), "orders.html", "cancelled orders not counted") +
                        card("Reservation requests", stats.requestedReservations, "reservations.html", "waiting for a table") +
                        card("Customers", stats.customers, "customers.html") +
                        card("Dishes on menu", stats.dishes, "menu.html", stats.unavailableDishes + " unavailable");

                    document.getElementById("recent").innerHTML = stats.recentOrders.length
                        ? stats.recentOrders.map((order) => `
                            <tr class="border-b last:border-0">
                                <td class="p-3 font-semibold">#${order.id.slice(-6).toUpperCase()}</td>
                                <td class="p-3">${esc(order.customerName)}</td>
                                <td class="p-3 capitalize">${esc(order.orderType)}</td>
                                <td class="p-3">${money(order.total)}</td>
                                <td class="p-3">${badge(order.status)}</td>
                            </tr>`).join("")
                        : '<tr><td colspan="5" class="p-4 text-ink/60">No orders yet.</td></tr>';
                })
                .catch((error) => toast(error.message, true));
        }
    </script>
</body>
</html>
