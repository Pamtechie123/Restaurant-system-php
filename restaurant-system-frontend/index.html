<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | ChopOps</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/config.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="navbar" class="sticky top-0 z-40 bg-white/95 shadow-sm backdrop-blur"></header>

    <main>
        <!-- Hero -->
        <section class="mx-auto grid max-w-6xl items-center gap-10 px-4 py-12 md:grid-cols-2">
            <div>
                <span class="inline-block rounded-md bg-brand px-4 py-1 text-sm font-bold tracking-wide text-white">
                    Fresh &nbsp;·&nbsp; Tasty &nbsp;·&nbsp; Always
                </span>
                <h1 class="mt-5 text-4xl font-extrabold leading-tight sm:text-5xl">Delicious meals, made just for you.</h1>
                <p class="mt-4 max-w-md text-ink/70">Delicious meals, made with the freshest ingredients just for you.</p>
                <div class="mt-7 flex gap-3">
                    <a href="menu.html" class="btn">Order Now</a>
                    <a href="menu.html" class="btn btn-outline">View menu</a>
                </div>
            </div>
            <img src="images/jollof-hero.jpg" alt="Jollof rice with fried plantain"
                 class="mx-auto aspect-square w-full max-w-md rounded-[2.5rem] object-cover shadow-xl">
        </section>

        <!-- Featured dishes -->
        <section class="mx-auto max-w-6xl px-4">
            <div class="mb-4 flex items-center justify-between">
                <h2 class="text-2xl font-bold">Our Featured Dishes</h2>
                <a href="menu.html" class="text-sm font-semibold text-brand">View all</a>
            </div>
            <div id="featured" class="grid grid-cols-2 gap-4 md:grid-cols-4">
                <p class="col-span-full text-ink/60">Loading dishes...</p>
            </div>
        </section>

        <!-- Reservation call to action -->
        <section class="mx-auto mt-12 max-w-6xl px-4">
            <div class="flex flex-col items-start justify-between gap-4 rounded-3xl bg-cream p-6 sm:flex-row sm:items-center">
                <div>
                    <h3 class="text-xl font-bold text-brand">Plan a special meal?</h3>
                    <p class="text-ink/70">Reserve your table and enjoy a great dining experience.</p>
                </div>
                <a href="reservation.html" class="btn">Reserve a table</a>
            </div>
        </section>
    </main>

    <footer id="footer"></footer>

    <script src="js/app.js"></script>
    <script>
        const featured = document.getElementById("featured");

        loadDishes()
            .then((dishes) => {
                const available = dishes.filter((dish) => dish.isAvailable !== false).slice(0, 4);
                featured.innerHTML = available.length
                    ? available.map(dishCard).join("")
                    : '<p class="col-span-full text-ink/60">No dishes yet. Please check back soon.</p>';
            })
            .catch((error) => {
                featured.innerHTML = `<p class="col-span-full text-red-600">${esc(error.message)}</p>`;
            });
    </script>
</body>
</html>
