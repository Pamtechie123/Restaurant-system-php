<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Details | ChopOps</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/config.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="navbar" class="sticky top-0 z-40 bg-white/95 shadow-sm backdrop-blur"></header>

    <main class="mx-auto max-w-3xl px-4 py-8">
        <a href="menu.html" class="mb-4 inline-flex h-10 w-10 items-center justify-center rounded-full bg-white text-xl shadow" aria-label="Back to menu">&larr;</a>

        <div id="dish"><p class="text-ink/60">Loading...</p></div>
    </main>

    <footer id="footer"></footer>

    <script src="js/app.js"></script>
    <script>
        const box = document.getElementById("dish");
        const id = new URLSearchParams(location.search).get("id");
        let quantity = 1;
        let dish = null;

        function show() {
            const unavailable = dish.isAvailable === false;

            box.innerHTML = `
            <img src="${imageSrc(dish.imageUrl)}" alt="${esc(dish.name)}" class="h-64 w-full rounded-3xl object-cover shadow-lg sm:h-96">

            <h1 class="mt-5 text-3xl font-extrabold">${esc(dish.name)}</h1>
            <p class="mt-1 text-2xl font-bold text-brand">${money(dish.price)}</p>
            <p class="mt-3 text-ink/70">${esc(dish.description) || "Made fresh with the finest ingredients."}</p>

            <p class="mt-4">
                ${unavailable
                    ? '<span class="badge badge-cancelled text-sm">Unavailable right now</span>'
                    : '<span class="badge badge-served text-sm">Available</span>'}
            </p>

            <div class="mt-6 flex items-center justify-center gap-6 rounded-2xl border border-orange-100 py-2 text-xl font-bold">
                <button id="minus" class="h-10 w-10 rounded-full hover:bg-cream">-</button>
                <span id="qty" class="w-8 text-center">${quantity}</span>
                <button id="plus" class="h-10 w-10 rounded-full hover:bg-cream">+</button>
            </div>

            <button id="add" class="btn mt-4 w-full py-3 text-lg" ${unavailable ? "disabled" : ""}>Add to cart</button>`;

            document.getElementById("minus").onclick = () => {
                quantity = Math.max(1, quantity - 1);
                document.getElementById("qty").textContent = quantity;
            };
            document.getElementById("plus").onclick = () => {
                quantity += 1;
                document.getElementById("qty").textContent = quantity;
            };
            document.getElementById("add").onclick = () => addToCart(dish, quantity);
        }

        api("/menu/" + id)
            .then((data) => {
                dish = data;
                show();
            })
            .catch((error) => {
                box.innerHTML = `<p class="text-red-600">${esc(error.message)}</p>`;
            });
    </script>
</body>
</html>
